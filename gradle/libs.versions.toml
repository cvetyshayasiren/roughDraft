[versions]
androidx-lifecycle = "2.9.1"
composeHotReload = "1.0.0-rc04"
composeMultiplatform = "1.9.0"
junit = "4.13.2"
kotlin = "2.2.0"
kotlinx-coroutines = "1.10.2"
landscapist = "2.5.2"
serialization-json = "1.9.0"
mapcompose = "0.10.0"
adaptive = "1.2.0-alpha03"
colormath = "3.6.1"
materialkolor = "3.0.0"
datetime = "0.7.1"
kim = "0.26"
haze = "1.6.10"
sketch = "4.4.0-alpha01"
ktorfit = "2.6.4"
material3AlphaExpressive = "1.9.0-alpha04"
telephoto = "0.18.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
landscapist-coil3 = { module = "com.github.skydoves:landscapist-coil3", version.ref = "landscapist" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
mapcompose = { module = "ovh.plrapps:mapcompose-mp", version.ref = "mapcompose" }
adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "adaptive" }
adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive" }
colormath-compose = { module = "com.github.ajalt.colormath:colormath-ext-jetpack-compose", version.ref = "colormath" }
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kim = { module = "com.ashampoo:kim", version.ref = "kim" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }
sketch = { module = "io.github.panpf.sketch4:sketch-compose", version.ref = "sketch" }
sketch-res = { module = "io.github.panpf.sketch4:sketch-compose-resources", version.ref = "sketch" }
ktorfit = { module = "de.jensklingenberg.ktorfit:ktorfit-lib", version.ref = "ktorfit" }
material3AlphaExpressive = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3AlphaExpressive" }
telephoto = { module = "me.saket.telephoto:zoomable", version.ref = "telephoto" }

[bundles]
adaptive = ["adaptive", "adaptive-layout", "adaptive-navigation"]
haze = ["haze", "haze-materials"]
sketch = ["sketch", "sketch-res"]

[plugins]
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }